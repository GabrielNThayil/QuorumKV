x-node: &node
  build: .
  restart: "no"

x-cluster: &cluster "node1=node1:7000:8000,node2=node2:7000:8000,node3=node3:7000:8000"

services:
  node1:
    <<: *node
    command: ["--id", "node1", "--cluster", *cluster, "--data", "/data", "--bind", "0.0.0.0"]
    ports: ["8001:8000"]
    volumes: ["node1:/data"]
  node2:
    <<: *node
    command: ["--id", "node2", "--cluster", *cluster, "--data", "/data", "--bind", "0.0.0.0"]
    ports: ["8002:8000"]
    volumes: ["node2:/data"]
  node3:
    <<: *node
    command: ["--id", "node3", "--cluster", *cluster, "--data", "/data", "--bind", "0.0.0.0"]
    ports: ["8003:8000"]
    volumes: ["node3:/data"]

volumes:
  node1: {}
  node2: {}
  node3: {}
